name: Agent Verify (Ppoyo)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check inline HTML scripts and localStorage key invariant
        run: |
          node -e "const fs=require('fs'),vm=require('vm');const h=fs.readFileSync('furball-chain.html','utf8');let i=0;for(const m of h.matchAll(/<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/gi)){new vm.Script(m[1],{filename:'furball-chain.html#'+(++i)});}if(!h.includes('byeolsatang-best')) throw new Error('Missing byeolsatang-best localStorage key');console.log('OK scripts:',i);"
